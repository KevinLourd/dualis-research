# Own compose project on the box (`-p dualis-wa`, folder /root/dualis-wa), never part of distribute's stack.
services:
  wa:
    build:
      context: ..
      dockerfile: wa/Dockerfile
    container_name: dualis-wa
    restart: unless-stopped
    env_file: /root/dualis-wa/.env
    volumes:
      - data:/data
    # Shared box: cap it, and let the kernel pick this container before anything else if memory runs out.
    mem_limit: 1500m
    oom_score_adj: 500
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  # The Baileys session (linked device). Named explicitly so a project rename never starts a fresh, unlinked one.
  data:
    name: dualis-wa_data
