name: Deploy cron

# The dualis-cron Worker: Cloudflare Cron Triggers that start collect.yml on time (GitHub's own schedule runs hours
# late or never on the free plan; 2026-11-12 the 08:00 Growth brief never left).
on:
  push:
    branches: [main]
    paths: ["cron/**", ".github/workflows/deploy-cron.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cron
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISPATCH_TOKEN: ${{ secrets.DRAFT_DISPATCH_TOKEN }}
    steps:
      - name: Required secrets are set
        working-directory: .
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISPATCH_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            for name in $missing; do echo "::error::Missing GitHub repo secret for:$name"; done
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test src/plan.test.ts
      - name: Deploy to Cloudflare Workers (runtime secret uploaded with the version)
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/cron-secrets.json", JSON.stringify({ DISPATCH_TOKEN: process.env.DISPATCH_TOKEN }))'
          set -o pipefail
          npx --yes wrangler@4.157.0 deploy --secrets-file "$RUNNER_TEMP/cron-secrets.json" | tee deploy.log
          rm -f "$RUNNER_TEMP/cron-secrets.json"
      - name: Cloudflare serves the crons
        run: |
          crons=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/dualis-cron/schedules" | jq -c '[.result.schedules[].cron] | sort')
          want=$(node -e 'const c=require("fs").readFileSync("wrangler.jsonc","utf8"); console.log(JSON.stringify(JSON.parse(c.match(/"crons":\s*(\[[^\]]*\])/)[1]).sort()))')
          echo "served: $crons"; echo "wanted: $want"
          [ "$crons" = "$want" ] || { echo "::error::dualis-cron schedules differ from wrangler.jsonc"; exit 1; }
          echo "### dualis-cron live, crons (UTC): $crons" >> "$GITHUB_STEP_SUMMARY"
