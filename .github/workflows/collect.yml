name: Collect

# Every 4 hours (Kevin 2026-11-06): the full collect once a day, the analysis chain (`core`: news, filings, prices,
# judged evidence, signals) the other five times. GitHub may delay a scheduled run: the Data page shows the last one.
on:
  schedule:
    - cron: "15 5 * * *" # 05:15 UTC, before the European open: everything
    - cron: "15 1,9,13,17,21 * * *" # the analysis chain only
    - cron: "0 2 * * *" # 07:00 Astana: fresh subscriber count + outreach, then the 08:00 Growth brief on WhatsApp
  workflow_dispatch:
    inputs:
      dimension:
        description: "Dimension to collect (all, core = analysis chain, growth = Substack/content, or one name)"
        default: all
        required: true

concurrency:
  group: collect
  cancel-in-progress: false

# The Sandbox review (skill content-review) edits the writing skills: committed to main at the end of the run.
permissions:
  contents: write

jobs:
  collect:
    # 24.04: Chrome is on the image (content-visuals captures news pages with it); ffmpeg added below (its card video).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      WHATSAPP_ALLOWLIST: ${{ secrets.WHATSAPP_ALLOWLIST }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ONEDRIVE_TOKEN_KEY: ${{ secrets.ONEDRIVE_TOKEN_KEY }}
      COLLECT_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
    steps:
      - name: Database secret is set
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ] && [ -z "$DATABASE_URL" ]; then echo "::error::Missing GitHub repo secret: DATABASE_URL_UNPOOLED"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # ffmpeg for the card video: a static build from GitHub, cached (apt-get on the runner hung 15+ min, 2026-11-06).
      - name: Restore ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-n8.1
      - name: Download ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: mkdir -p ~/ffmpeg && curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ -C ~/ffmpeg --strip-components=1
      - run: echo "FFMPEG_PATH=$HOME/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV" && ~/ffmpeg/bin/ffmpeg -version | head -1
      - run: pnpm db:migrate
      - run: pnpm collect ${{ github.event.inputs.dimension || (github.event.schedule == '15 5 * * *' && 'all') || (github.event.schedule == '0 2 * * *' && 'growth-outreach,substack-network,growth-brief') || 'core' }}
      # The Sandbox loop (Kevin 2026-11-11): a failed review edited the writing skills, the day is written, drawn and
      # reviewed again with them, up to round 3 (rounds with nothing to do are no-ops).
      - name: Sandbox rounds 2 and 3
        if: github.event.schedule == '15 5 * * *' || github.event.inputs.dimension == 'all' || contains(github.event.inputs.dimension, 'sandbox')
        run: |
          pnpm collect sandbox-posts,sandbox-visuals,sandbox-review
          pnpm collect sandbox-posts,sandbox-visuals,sandbox-review
      - name: Commit the skills the review edited
        if: always()
        working-directory: .
        run: |
          if git diff --quiet -- .claude/skills; then exit 0; fi
          git config user.name "dualis-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills
          git commit -m "skills: content-review edits after the Sandbox review (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          git diff HEAD~1 --stat >> "$GITHUB_STEP_SUMMARY"
