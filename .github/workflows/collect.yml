name: Collect

# Every 4 hours (Kevin 2026-11-06): the full collect once a day, the analysis chain (`core`: news, filings, prices,
# judged evidence, signals) the other five times. GitHub may delay a scheduled run: the Data page shows the last one.
on:
  schedule:
    - cron: "15 5 * * *" # 05:15 UTC, before the European open: everything
    - cron: "15 1,9,13,17,21 * * *" # the analysis chain only
  workflow_dispatch:
    inputs:
      dimension:
        description: "Dimension to collect (all, core = analysis chain, growth = Substack/content, or one name)"
        default: all
        required: true

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      WHATSAPP_ALLOWLIST: ${{ secrets.WHATSAPP_ALLOWLIST }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ONEDRIVE_TOKEN_KEY: ${{ secrets.ONEDRIVE_TOKEN_KEY }}
      COLLECT_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
    steps:
      - name: Database secret is set
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ] && [ -z "$DATABASE_URL" ]; then echo "::error::Missing GitHub repo secret: DATABASE_URL_UNPOOLED"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm collect ${{ github.event.inputs.dimension || (github.event.schedule == '15 5 * * *' && 'all') || 'core' }}
