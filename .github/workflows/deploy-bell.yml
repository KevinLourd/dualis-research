name: Deploy bell

# The dualis-bell Worker: the WhatsApp doorbell. A queued message POSTs /ring, the WhatsApp service (listening on a
# WebSocket) reads its outbox at once (Kevin 2026-11-16: « il faut de l'immédiat pour WA »).
on:
  push:
    branches: [main]
    paths: ["bell/**", ".github/workflows/deploy-bell.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-bell
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bell
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BELL_TOKEN: ${{ secrets.BELL_TOKEN }}
    steps:
      - name: Required secrets are set
        working-directory: .
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BELL_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            for name in $missing; do echo "::error::Missing GitHub repo secret for:$name"; done
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test src/auth.test.ts
      - name: Deploy to Cloudflare Workers (runtime secret uploaded with the version)
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/bell-secrets.json", JSON.stringify({ BELL_TOKEN: process.env.BELL_TOKEN }))'
          set -o pipefail
          npx --yes wrangler@4.157.0 deploy --secrets-file "$RUNNER_TEMP/bell-secrets.json" | tee deploy.log
          rm -f "$RUNNER_TEMP/bell-secrets.json"
      - name: The bell answers and refuses a wrong token
        run: |
          ok=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $BELL_TOKEN" https://dualis-bell.dualis-research.workers.dev/ring)
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer wrong" https://dualis-bell.dualis-research.workers.dev/ring)
          echo "ring with token: $ok, wrong token: $bad"
          [ "$ok" = 200 ] && [ "$bad" = 401 ] || { echo "::error::dualis-bell is not serving /ring as expected"; exit 1; }
          echo "### dualis-bell live" >> "$GITHUB_STEP_SUMMARY"
