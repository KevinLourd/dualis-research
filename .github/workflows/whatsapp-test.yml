name: WhatsApp test

# Queues a test text + image to Kevin's number (never Thierry); the service sends them once the device is linked.
# With `signal_alerts` (e.g. "101160.KQ:none/noise>BUY/weak CCLD:BUY/weak>BUY/strong"): test Signal Change alerts instead.
on:
  workflow_dispatch:
    inputs:
      signal_alerts:
        description: "Signal alert test cases (SYMBOL:FROM/STRENGTH>TO/STRENGTH, space separated); empty = the plain test message"
        required: false
        default: ""

jobs:
  queue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      WHATSAPP_ALLOWLIST: ${{ secrets.WHATSAPP_ALLOWLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: inputs.signal_alerts == ''
        run: pnpm wa:test
      - if: inputs.signal_alerts != ''
        env:
          SIGNAL_ALERTS: ${{ inputs.signal_alerts }}
        # Unquoted on purpose: one argument per case; an env var is never parsed as shell syntax (`>`).
        run: pnpm wa:signal-test $SIGNAL_ALERTS
