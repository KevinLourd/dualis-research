name: CPU probe (temporary)

on:
  push:
    branches: ["KevinLourd/dualis-console-503-cpu"]
    paths: [".github/workflows/cpu-probe.yml", "web/worker.ts", "web/wrangler.jsonc"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ONEDRIVE_TOKEN_KEY: ${{ secrets.ONEDRIVE_TOKEN_KEY }}
      PROD: https://dualis-console.dualis-research.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
      - name: Upload a preview version (prod deployment untouched)
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/s.json", JSON.stringify({ DATABASE_URL: process.env.DATABASE_URL, CLERK_SECRET_KEY: process.env.CLERK_SECRET_KEY, AZURE_CLIENT_ID: process.env.AZURE_CLIENT_ID, AZURE_TENANT_ID: process.env.AZURE_TENANT_ID, ONEDRIVE_TOKEN_KEY: process.env.ONEDRIVE_TOKEN_KEY }))'
          npx wrangler versions upload --secrets-file "$RUNNER_TEMP/s.json" 2>&1 | tee up.log
          rm -f "$RUNNER_TEMP/s.json"
      - name: A/B on prod (50/50), then restore the current version
        run: |
          OLD=$(npx wrangler deployments status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(max(d["versions"], key=lambda v: v["percentage"])["version_id"])')
          NEW=$(grep -o 'Worker Version ID: [0-9a-f-]*' up.log | awk '{print $4}')
          echo "old $OLD new $NEW"; grep "Startup" up.log || true
          npx wrangler versions deploy "$NEW@50%" "$OLD@50%" -y --message "cpu probe A/B" > /dev/null
          npx wrangler tail dualis-console --format json > tail.jsonl 2> tail.err &
          sleep 15
          for p in /sign-in /tickers; do
            echo "== $p"
            for i in $(seq 1 60); do curl -s -o /dev/null -w "%{http_code} " "$PROD$p"; done; echo
          done
          sleep 15
          kill %1 || true
          npx wrangler versions deploy "$OLD@100%" -y --message "cpu probe restore" > /dev/null
          echo "restored $OLD"
          OLD=$OLD NEW=$NEW python3 - <<'PY'
          import json, collections, os
          dec = json.JSONDecoder(); s = open("tail.jsonl").read(); i = 0; rows = []
          while i < len(s):
              while i < len(s) and s[i].isspace(): i += 1
              if i >= len(s): break
              o, i = dec.raw_decode(s, i); rows.append(o)
          name = {os.environ["OLD"][:8]: "OLD", os.environ["NEW"][:8]: "NEW"}
          by = collections.defaultdict(list)
          for o in rows:
              url = ((o.get("event") or {}).get("request") or {}).get("url", "?")
              path = url.split(".workers.dev")[-1]
              ver = ((o.get("scriptVersion") or {}).get("id") or "?")[:8]
              by[(name.get(ver, ver), path)].append((o.get("outcome"), o.get("cpuTime")))
          for k, v in sorted(by.items()):
              c = sorted([x[1] for x in v if x[1] is not None])
              print(k, len(v), dict(collections.Counter(x[0] for x in v)), "median", c[len(c)//2] if c else None, "max", c[-1] if c else None, "over100", sum(1 for x in c if x > 100))
              print("   cpu", c)
          PY
