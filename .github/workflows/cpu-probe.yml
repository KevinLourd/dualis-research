name: CPU probe (temporary)

on:
  push:
    branches: ["KevinLourd/dualis-console-503-cpu"]
    paths: [".github/workflows/cpu-probe.yml", "web/worker.ts", "web/wrangler.jsonc"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ONEDRIVE_TOKEN_KEY: ${{ secrets.ONEDRIVE_TOKEN_KEY }}
      PROD: https://dualis-console.dualis-research.workers.dev
    steps:
      - name: Tail 5 minutes (load pages meanwhile)
        run: |
          timeout 300 npx -y wrangler@4 tail dualis-console --format json > tail.jsonl 2> tail.err || true
          python3 - <<'PY'
          import json, collections
          dec = json.JSONDecoder(); s = open("tail.jsonl").read(); i = 0
          while i < len(s):
              while i < len(s) and s[i].isspace(): i += 1
              if i >= len(s): break
              o, i = dec.raw_decode(s, i)
              url = ((o.get("event") or {}).get("request") or {}).get("url", "?").split(".workers.dev")[-1]
              hdr = ((o.get("event") or {}).get("request") or {}).get("headers") or {}
              rsc = "RSC " if hdr.get("rsc") else ""
              ex = ";".join((e.get("message") or "")[:60] for e in (o.get("exceptions") or []))
              print(o.get("outcome"), o.get("cpuTime"), o.get("wallTime"), rsc + url[:90], ex)
          PY
