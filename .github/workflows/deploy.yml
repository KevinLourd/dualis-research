name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # starts the Collect workflow after a deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # The console runs as a Node server on the Dualis server (web/deploy/README.md): a deploy-only SSH key whose
      # only command is /srv/console/deploy-hook.sh.
      CONSOLE_DEPLOY_KEY: ${{ secrets.CONSOLE_DEPLOY_KEY }}
      CONSOLE_DEPLOY_HOST: ${{ secrets.CONSOLE_DEPLOY_HOST }}
      CONSOLE_DEPLOY_KNOWN_HOSTS: ${{ secrets.CONSOLE_DEPLOY_KNOWN_HOSTS }}
      # The doorbell of the WhatsApp service: a message the console queues leaves at once.
      BELL_TOKEN: ${{ secrets.BELL_TOKEN }}
      # Thierry's OneDrive sign-in (Settings > OneDrive): the Azure app of his Duality tenant + the key sealing his token.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ONEDRIVE_TOKEN_KEY: ${{ secrets.ONEDRIVE_TOKEN_KEY }}
      # Optional: lets Create draft (Content > Ideas) start draft.yml at once; without it a request waits for the next collect.
      DRAFT_DISPATCH_TOKEN: ${{ secrets.DRAFT_DISPATCH_TOKEN }}
      # Seals the Claude connector's OAuth codes and tokens (web/src/connector/oauth.ts).
      MCP_OAUTH_KEY: ${{ secrets.MCP_OAUTH_KEY }}
    steps:
      - name: Required secrets are set
        working-directory: .
        run: |
          missing=""
          for name in DATABASE_URL DATABASE_URL_UNPOOLED CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CONSOLE_DEPLOY_KEY CONSOLE_DEPLOY_HOST CONSOLE_DEPLOY_KNOWN_HOSTS AZURE_CLIENT_ID AZURE_TENANT_ID ONEDRIVE_TOKEN_KEY MCP_OAUTH_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            for name in $missing; do echo "::error::Missing GitHub repo secret: $name"; done
            echo "Add them in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge diff decides what to collect
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Migrate the database
        run: pnpm db:migrate
      - name: Build the console (Next.js standalone Node server)
        run: pnpm build
      - name: Deploy to the Dualis server
        run: |
          set -o pipefail  # a failed deploy must fail the step, not hide behind tee (2026-11-06: site deploy 503 read green)
          umask 077
          out="$RUNNER_TEMP/console"
          mkdir -p "$out"
          cp -R .next/standalone/. "$out/"
          mkdir -p "$out/.next" && cp -R .next/static "$out/.next/static"
          if [ -d public ]; then cp -R public "$out/public"; fi
          # The server reads the database locally: same user and password, host 127.0.0.1, no TLS hop.
          local_db=$(python3 -c 'import os, urllib.parse as u; p = u.urlsplit(os.environ["DATABASE_URL"]); print(u.urlunsplit((p.scheme, f"{p.username}:{p.password}@127.0.0.1:5432", p.path, "sslmode=disable", "")))')
          {
            printf 'DATABASE_URL=%s\n' "$local_db"
            printf 'CLERK_SECRET_KEY=%s\n' "$CLERK_SECRET_KEY"
            printf 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=%s\n' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            printf 'AZURE_CLIENT_ID=%s\nAZURE_TENANT_ID=%s\nONEDRIVE_TOKEN_KEY=%s\n' "$AZURE_CLIENT_ID" "$AZURE_TENANT_ID" "$ONEDRIVE_TOKEN_KEY"
            printf 'MCP_OAUTH_KEY=%s\n' "$MCP_OAUTH_KEY"
            if [ -n "$DRAFT_DISPATCH_TOKEN" ]; then printf 'DRAFT_DISPATCH_TOKEN=%s\n' "$DRAFT_DISPATCH_TOKEN"; fi
            if [ -n "$BELL_TOKEN" ]; then printf 'BELL_TOKEN=%s\n' "$BELL_TOKEN"; fi
          } > "$out/console.env"
          printf '%s\n' "$CONSOLE_DEPLOY_KEY" > "$RUNNER_TEMP/console_key"
          printf '%s\n' "$CONSOLE_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/console_known_hosts"
          tar czf "$RUNNER_TEMP/console.tgz" -C "$out" .
          rm -rf "$out"
          du -h "$RUNNER_TEMP/console.tgz"
          ssh -i "$RUNNER_TEMP/console_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/console_known_hosts" "$CONSOLE_DEPLOY_HOST" < "$RUNNER_TEMP/console.tgz" | tee console-deploy.log
          rm -f "$RUNNER_TEMP/console_key" "$RUNNER_TEMP/console.tgz"
          echo "### Console" >> "$GITHUB_STEP_SUMMARY"
          tail -2 console-deploy.log >> "$GITHUB_STEP_SUMMARY"
      # Only what this merge can move (Kevin 2026-11-06 « speeder x10 »): a dimension's folder -> it and every later
      # one; shared collector / schema / LLM code -> core; console, site, docs -> nothing (registry.ts collectPlan).
      - name: Refresh data now
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || echo web/src/collectors/runner.ts)
          plan=$(pnpm --silent collect plan $files | tail -1)
          if [ -z "$plan" ]; then echo "### Nothing to collect: no collector code changed" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "### Collect: $plan" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run collect.yml -R "$GITHUB_REPOSITORY" -f dimension="$plan"

  # Dualis's WhatsApp device (wa/) runs on a box, not on Workers. After migrations, ship the code + its database
  # URL and Claude token over SSH; the box key can only run wa/box/deploy-hook.sh, which rebuilds only when something changed.
  whatsapp:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WA_DEPLOY_KEY: ${{ secrets.WA_DEPLOY_KEY }}
      WA_DEPLOY_HOST: ${{ secrets.WA_DEPLOY_HOST }}
      WA_DEPLOY_KNOWN_HOSTS: ${{ secrets.WA_DEPLOY_KNOWN_HOSTS }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      WHATSAPP_ALLOWLIST: ${{ secrets.WHATSAPP_ALLOWLIST }}
      BELL_TOKEN: ${{ secrets.BELL_TOKEN }}
    steps:
      - name: Required secrets are set
        run: |
          missing=""
          for name in WA_DEPLOY_KEY WA_DEPLOY_HOST WA_DEPLOY_KNOWN_HOSTS DATABASE_URL_UNPOOLED CLAUDE_OAUTH_TOKEN WHATSAPP_ALLOWLIST BELL_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            for name in $missing; do echo "::error::Missing GitHub repo secret: $name"; done
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Ship the WhatsApp service
        run: |
          umask 077
          printf '%s\n' "$WA_DEPLOY_KEY" > "$RUNNER_TEMP/wa_key"
          printf '%s\n' "$WA_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/wa_known_hosts"
          printf 'DATABASE_URL_UNPOOLED=%s\n' "$DATABASE_URL_UNPOOLED" > wa/box.env
          # Kevin's Claude subscription for the hosted dimensions; the paid API key is never shipped.
          printf 'CLAUDE_OAUTH_TOKEN=%s\n' "$CLAUDE_OAUTH_TOKEN" >> wa/box.env
          # The only numbers the device talks to (personal numbers: a secret, never in the public repo).
          printf 'WHATSAPP_ALLOWLIST=%s\n' "$WHATSAPP_ALLOWLIST" >> wa/box.env
          # The doorbell (dualis-bell Worker): a queued message is read at once, not on the 30-minute idle tick.
          printf 'BELL_TOKEN=%s\n' "$BELL_TOKEN" >> wa/box.env
          tar czf "$RUNNER_TEMP/wa.tgz" --exclude=wa/node_modules --exclude=wa/dist wa web/src
          rm wa/box.env
          set -o pipefail  # a failed deploy must fail the step, not hide behind tee (2026-11-06: site deploy 503 read green)
          ssh -i "$RUNNER_TEMP/wa_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/wa_known_hosts" "$WA_DEPLOY_HOST" < "$RUNNER_TEMP/wa.tgz" | tee wa-deploy.log
          rm -f "$RUNNER_TEMP/wa_key" "$RUNNER_TEMP/wa.tgz"
          echo "### WhatsApp service" >> "$GITHUB_STEP_SUMMARY"
          tail -3 wa-deploy.log >> "$GITHUB_STEP_SUMMARY"
