name: Cloudflare ops

# One-off account operations with the repo's Cloudflare token (it lives only in GitHub secrets).
# Order inside one run: rename the workers.dev subdomain, wait until every check URL answers 200, then delete the
# retired Workers. A failed check stops the run before anything is deleted.
on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: "New workers.dev account subdomain (empty = keep)"
        required: false
      check_urls:
        description: "Space-separated URLs that must answer 200 before any delete"
        required: true
      retire_workers:
        description: "Space-separated Worker names to delete once the checks pass (empty = none)"
        required: false

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUBDOMAIN: ${{ inputs.subdomain }}
      CHECK_URLS: ${{ inputs.check_urls }}
      RETIRE: ${{ inputs.retire_workers }}
    steps:
      - name: Rename the workers.dev subdomain
        if: inputs.subdomain != ''
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          echo "before: $(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -c '.result, .errors')"
          current=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          put() { curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$1\"}" "$api"; }
          # The API only sets a subdomain on an account that has none (10036 otherwise): release the current one, then
          # claim the new one; if that claim fails, take the old one straight back so no Worker loses its URL.
          if [ -n "$current" ] && [ "$current" != "$SUBDOMAIN" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -c '.success, .errors'
          fi
          out=$(put "$SUBDOMAIN")
          echo "$out" | jq -c '.success, .result, .errors'
          if [ "$(echo "$out" | jq -r .success)" != "true" ]; then
            [ -n "$current" ] && echo "restore: $(put "$current" | jq -c '.success, .errors')"
            exit 1
          fi
      - name: Every check URL answers 200
        run: |
          for url in $CHECK_URLS; do
            code=000
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" = "200" ] && break
              sleep 20
            done
            echo "$code $url"
            [ "$code" = "200" ] || { echo "::error::$url answered $code"; exit 1; }
          done
      - name: Delete the retired Workers
        if: inputs.retire_workers != ''
        run: |
          for name in $RETIRE; do
            out=$(curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name?force=true")
            echo "$name: $(echo "$out" | jq -c '.success, .errors')"
            [ "$(echo "$out" | jq -r .success)" = "true" ]
          done
