name: X publish

# Posts each connected X account's next due Sandbox post on X, text + picture (Kevin 2026-11-13). Started every hour
# from 08:10 to 21:10 Astana by the dualis-cron Worker (`cron/`). Its own concurrency group: never queued behind a long
# collect, and never two at once (each run rotates the account's refresh token).
on:
  workflow_dispatch:

concurrency:
  group: x-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_TOKEN_KEY: ${{ secrets.X_TOKEN_KEY }}
      # First token of each account (read once, while the account has no stored token).
      X_REFRESH_TOKEN_SIRENSMALLCAPS: ${{ secrets.X_REFRESH_TOKEN_SIRENSMALLCAPS }}
      COLLECT_TRIGGER: schedule
    steps:
      - name: Required secrets are set
        working-directory: .
        run: |
          missing=""
          for name in DATABASE_URL X_CLIENT_ID X_CLIENT_SECRET X_TOKEN_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            for name in $missing; do echo "::error::Missing GitHub repo secret:$name"; done
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect x-publish
