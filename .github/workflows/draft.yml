name: Draft

# Writes the drafts Thierry asked for on the Ideas table (Create draft) and their visuals, started by the console right after his click
# (DRAFT_DISPATCH_TOKEN on the Worker). Its own concurrency group: never queued behind a long collect.
on:
  workflow_dispatch:

concurrency:
  group: draft
  cancel-in-progress: false

jobs:
  draft:
    # 24.04: Chrome is on the image (the news capture uses it), ffmpeg is added below (the card video).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      COLLECT_TRIGGER: manual
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # ffmpeg for the card video: a static build from GitHub, cached (apt-get on the runner hung 15+ min, 2026-11-06).
      - name: Restore ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-n8.1
      - name: Download ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: mkdir -p ~/ffmpeg && curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ -C ~/ffmpeg --strip-components=1
      - run: echo "FFMPEG_PATH=$HOME/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV" && ~/ffmpeg/bin/ffmpeg -version | head -1
      - run: pnpm collect content-drafts,content-visuals
