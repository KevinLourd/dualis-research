name: Draft

# Writes the drafts Thierry asked for on the Ideas table (Create draft) and their visuals, started by the console right after his click
# (DRAFT_DISPATCH_TOKEN on the Worker). Its own concurrency group: never queued behind a long collect.
on:
  workflow_dispatch:

concurrency:
  group: draft
  cancel-in-progress: false

jobs:
  draft:
    # 24.04: Chrome is on the image (the news capture uses it), ffmpeg is added below (the card video).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      COLLECT_TRIGGER: manual
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - run: pnpm collect content-drafts,content-visuals
