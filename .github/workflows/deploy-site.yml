name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Required secrets are set
        working-directory: .
        run: |
          missing=""
          for name in DATABASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            for name in $missing; do echo "::error::Missing GitHub repo secret: $name"; done
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build Worker
        run: pnpm cf:build
      - name: Deploy to Cloudflare Workers (runtime secret uploaded with the version)
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/site-secrets.json", JSON.stringify({ DATABASE_URL: process.env.DATABASE_URL }))'
          set -o pipefail  # a failed deploy must fail the step, not hide behind tee (2026-11-06: site deploy 503 read green)
          pnpm cf:deploy -- --secrets-file "$RUNNER_TEMP/site-secrets.json" | tee deploy.log
          rm -f "$RUNNER_TEMP/site-secrets.json"
          url=$(grep -o 'https://[a-zA-Z0-9.-]*\.workers\.dev' deploy.log | head -1)
          echo "### Site live at $url" >> "$GITHUB_STEP_SUMMARY"
